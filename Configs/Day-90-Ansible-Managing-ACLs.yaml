- name: Configure blog.txt on App Server 1
  hosts: stapp01
  become: yes
  tasks:

    - name: Create directory
      file:
        path: /opt/devops
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create blog.txt
      file:
        path: /opt/devops/blog.txt
        state: touch
        owner: root
        group: root

    - name: Set ACL for group tony
      acl:
        path: /opt/devops/blog.txt
        entity: tony
        etype: group
        permissions: r
        state: present

